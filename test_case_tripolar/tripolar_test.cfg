[model]
init_file = init.nc
start = 2023-01-01T00:00:00Z
stop = 2023-01-05T00:00:00Z
time_step = P0-0T00:01:00
missing_value = 1e20

[Modules]
DiagnosticOutputModule = Nextsim::ConfigOutput
DynamicsModule = Nextsim::MEVPDynamics
AtmosphereBoundaryModule = Nextsim::TripolarTestAtmosphere
OceanBoundaryModule = Nextsim::ConstantOceanBoundary
IceThermodynamicsModule = Nextsim::ThermoWinton

[ConfigOutput]
period = P0-0T04:00:00
field_names = hice,cice,u,v
filename = diagnostic.nc

[nextsim_thermo]
use_thermo_forcing = false
