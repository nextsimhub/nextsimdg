[model]
init_file = advection_test_init.nc
start = 2010-01-01T00:00:00Z
stop = 2010-01-06T00:00:00Z
time_step = P0-0T00:15:00
restart_file = advection_test.restart.nc

[nextsim_thermo]
use_thermo_forcing = false

[Modules]
DiagnosticOutputModule = Nextsim::ConfigOutput
DynamicsModule = Nextsim::BBMDynamics
IceThermodynamicsModule = Nextsim::DummyIceThermodynamics
AtmosphereBoundaryModule = Nextsim::ConfiguredAtmosphere
OceanBoundaryModule = Nextsim::ConfiguredOcean

[ConfigOutput]
period = 900
start = 2010-01-01T00:00:00Z
field_names = hsnow,hice,tsurf,cice,u,v,ocean_u,ocean_v
filename = advection_test.diagnostic.nc

[ConfiguredOcean]
current_u = 0.1

[ConfiguredAtmosphere]
wind_u = 0.1
