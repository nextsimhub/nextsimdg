[module]
name = Nextsim::IInput
file_prefix = Input
interface_prefix = I
header_path = include
external_header_path = ../include
description = The module providing capabilities to read forcing from file.

[Nextsim::GeoreferencedInput]
file_prefix = GeoreferencedInput
description = Read georeferenced netCDF files and interpolate their data onto the model grid.
has_help = no
is_default = true

[Nextsim::PlainInput]
file_prefix = PlainInput
description = Read netCDF files where the forcing grid corresponds to the model grid (preprocessed).
has_help = no
is_default = false
