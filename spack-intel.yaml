spack:
  packages:
    all:
      compiler: [oneapi]
      providers:
        mpi: [intel-oneapi-mpi]
  specs:
  - boost@1.80.0+log+program_options
  - catch2
  - 'cmake@3.20:'
  - eigen@3.4.0
  - gmake
  - hdf5@1.14.3
  - netcdf-c@4.9.2+mpi+parallel-netcdf
  - netcdf-cxx4@4.3.1
  - netcdf-fortran
  - zlib-ng@2.1.4
  # - trilinos
  # - zoltan ^autoconf@2.69
  concretizer:
    unify: true
    reuse: false
  # view: true
