name: Check formatting

on:
  push:
    branches: [ main, develop ]
  pull_request:
    paths:
      - '.github/workflows/linting.yml'
      - '**.cpp'
      - '**.hpp'
      - '**.py'
      - '**CMakeLists.txt'
  pull_request_review:
    branches: [ main, develop ]

permissions: {}

jobs:
  linting:
    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v2
      with:
        persist-credentials: false

    - name: clang-format
      run: |
        sudo apt update
        sudo apt install clang-format
        for component in core dynamics physics
        do
          cd $component/src
          clang-format --dry-run -Werror *cpp include/*hpp
          cd -
        done

    - name: ruff
      if: always()
      run: |
        cd ${{ github.workspace }}
        pip install ruff
        ruff format --diff ./
        ruff check --diff ./

    - name: cmake-lint
      run: |
        pip install cmakelang
        cmake-lint $(find . -name CMakeLists.txt) -c .cmake-lint-config.py
        # NOTE: We ignore C0103, which would enforce that variables are all-caps
        # NOTE: We ignore C0113, which would enforce that comments are used
        # NOTE: We set the tab size to 4
        # NOTE: We set the maximum line length to 100

  # Apply GitHub Actions linter, zizmor
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@e673c3917a1aef3c65c972347ed84ccd013ecda4 # v0.2.0
