# Workflow for checking the formatting of various file types
name: Check formatting

on:
  # Trigger the workflow upon merging into main or develop
  push:
    branches: [ main, develop ]

  # Trigger the workflow whenever commits are pushed to an open PR that changes one of the file types listed
  pull_request:
    paths:
      - '.github/workflows/*.yml'
      - '**.cpp'
      - '**.hpp'
      - '**.py'
      - '**CMakeLists.txt'

  # Enable running this workflow manually from the Actions tab
  workflow_dispatch:

# Restrict default permissions
permissions: {}

# Cancel running jobs if new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  # Linting for C++, Python, and CMake
  linting:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Apply C++ formatter, clang-format
    - name: clang-format
      run: |
        sudo apt update
        sudo apt install clang-format
        for component in core dynamics physics
        do
          cd $component/src
          clang-format --dry-run -Werror *cpp include/*hpp
          cd -
        done

    # Apply Python formatter, Ruff
    - name: ruff
      if: always()
      run: |
        cd ${{ github.workspace }}
        pip install ruff
        ruff format --diff ./
        ruff check --diff ./

    # Apply CMake linter, cmake-lint
    - name: cmake-lint
      run: |
        pip install cmakelang
        cmake-lint $(find . -name CMakeLists.txt) -c .cmake-lint-config.py

  # Apply GitHub Actions linter, zizmor
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
